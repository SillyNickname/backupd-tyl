#
# examples/backupd.database.conf
#
# Dedicated database backup vault for backupd-tyl
# Supports PostgreSQL, MySQL / MariaDB, SQLite3, and Redis.
#
# (C) 2026 Antigravity / Gemini (Google DeepMind)
# Based on original backupd concept by Ullrich von Bassewitz (1998)
# [Note: original author email uz@musoftware.de is no longer active]
# Requested and Commissioned by: Andre Kajita (kajita@univap.br)
#

# =========================================================================
# GLOBAL SETTINGS
# =========================================================================
Port = 12153
BindAddress = "0.0.0.0"
PidFile = "/var/run/backupd-database.pid"

# AES-256-GCM: industry gold standard for financial/database records
DefaultCipher = "aes256"
AllowLegacy = no

# Enterprise logging
LogTarget   = "file"
LogFile     = "/var/log/backupd-database.log"
LogLevel    = "info"
LogFacility = "daemon"

# Network ACL for database tier
ListAllow = "10.0.10.0/24 127.0.0.1/32"
ListDeny  = "*"

# =========================================================================
# DATABASE RESOURCES
#
# NOTE ON PERMISSIONS:
# - When 'user' is specified, backupd drops privileges to that user account.
# - If 'user' and 'group' are omitted, backupd runs the resource command
#   as root (useful when accessing raw databases, locks, or system services).
# =========================================================================

# -------------------------------------------------------------------------
# 1. PostgreSQL Custom-Format Streaming
# Runs as unprivileged 'postgres' user to interact directly with pg_restore
# -------------------------------------------------------------------------
[postgres-cluster]
user      = "postgres"
group     = "postgres"
lockfile  = "/var/lock/backupd-postgres.lock"
password  = "PgClusterSecretVaultKey2026!"
# Server restores custom-format dump into target staging database
write     = "zstd -d | pg_restore --clean --if-exists -d db_staging"
read      = "pg_dump -Fc db_production | zstd -T0 -4"
ListAllow = "10.0.10.15/32 10.0.10.16/32"
ListDeny  = "*"

# -------------------------------------------------------------------------
# 2. MySQL / MariaDB Transactional Dump
# Runs as unprivileged 'mysql' user
# -------------------------------------------------------------------------
[mysql-production]
user      = "mysql"
group     = "mysql"
lockfile  = "/var/lock/backupd-mysql.lock"
password  = "MySqlClusterSecretKey2026!"
write     = "zstd -d | mysql --defaults-file=/etc/mysql/debian.cnf production_db"
read      = "mariadb-dump --single-transaction --quick --routines production_db | zstd -T0 -4"
ListAllow = "10.0.10.20/32"
ListDeny  = "*"

# -------------------------------------------------------------------------
# 3. Redis In-Memory Database RDB Dump
# Runs as unprivileged 'redis' user
# -------------------------------------------------------------------------
[redis-cache]
user      = "redis"
group     = "redis"
lockfile  = "/var/lock/backupd-redis.lock"
password  = "RedisRdbBackupSecret2026!"
write     = "cat > /var/lib/redis/dump-restore.rdb"
read      = "cat /var/lib/redis/dump.rdb"
ListAllow = "10.0.10.30/32"
ListDeny  = "*"

# -------------------------------------------------------------------------
# 4. SQLite Application Databases (Multi-File Archive)
# No user/group specified -> runs as root (default) to access all app dirs
# -------------------------------------------------------------------------
[sqlite-apps]
lockfile  = "/var/lock/backupd-sqlite.lock"
password  = "SqliteAppsVaultSecretKey!"
write     = {
    TARGET_DIR="/var/backups/sqlite/%h"
    mkdir -p "$TARGET_DIR"
    TIMESTAMP=$(date +%Y%m%d_%H%M%S)
    OUTFILE="$TARGET_DIR/sqlite_bundle_${TIMESTAMP}.tar.zst"
    cat > "$OUTFILE"
    ln -sf "$OUTFILE" "$TARGET_DIR/latest.tar.zst"
}
read      = "cat /var/backups/sqlite/%h/latest.tar.zst"
ListAllow = "10.0.10.0/24"
ListDeny  = "*"

#
# Sample Client Usage:
#   # Backup PostgreSQL:
#   pg_dump -Fc db_production | zstd -4 | \
#     backupc -h db-backup.corp -c aes256 -P "PgClusterSecretVaultKey2026!" -T -w postgres-cluster
#
#   # Backup MariaDB:
#   mariadb-dump --single-transaction --quick production_db | zstd -4 | \
#     backupc -h db-backup.corp -c aes256 -P "MySqlClusterSecretKey2026!" -T -w mysql-production
#
