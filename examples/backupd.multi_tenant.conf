#
# examples/backupd.multi_tenant.conf
#
# Multi-tenant / Departmental backup configuration for backupd-tyl
# Designed for centralized enterprise backup servers hosting multiple
# independent departments or client organizations with strict isolation.
#
# (C) 2026 Antigravity / Gemini (Google DeepMind)
# Based on original backupd concept by Ullrich von Bassewitz (1998)
# [Note: original author email uz@musoftware.de is no longer active]
# Requested and Commissioned by: Andre Kajita (kajita@univap.br)
#

# =========================================================================
# GLOBAL SETTINGS
# =========================================================================
Port = 12153
BindAddress = "0.0.0.0"
PidFile = "/var/run/backupd-multitenant.pid"

# Default cipher: ChaCha20-Poly1305 (RFC 8439)
DefaultCipher = "chacha20"
AllowLegacy = no

# Logging to syslog (rsyslog / systemd-journald)
LogTarget   = "syslog"
LogFacility = "daemon"
LogLevel    = "info"

# Global default: deny discovery listing to everyone unless overridden locally
ListDeny = "*"

# =========================================================================
# TENANT RESOURCES
#
# NOTE ON PERMISSIONS:
# - Resources can specify 'user' and 'group' to run under dedicated tenant
#   system accounts (principle of least privilege).
# - If 'user' and 'group' are omitted (such as in [compliance-worm]),
#   backupd-tyl defaults to executing the command as root (UID 0 / GID 0).
# =========================================================================

# -------------------------------------------------------------------------
# 1. Finance Department Vault
# Runs under unprivileged user 'finance' with private subnet restriction
# -------------------------------------------------------------------------
[finance-vault]
user      = "finance"
group     = "finance"
lockfile  = "/var/lock/backupd-finance.lock"
password  = "FinanceDeptSecretKey#2026"
write     = {
    DEST="/var/backups/tenants/finance/%h"
    mkdir -p "$DEST"
    cat > "$DEST/%H-%d.tar.zst"
}
read      = "cat /var/backups/tenants/finance/%h/latest.tar.zst"
ListAllow = "10.100.10.0/24"
ListDeny  = "*"

# -------------------------------------------------------------------------
# 2. Engineering Department Repository Backups
# Runs under unprivileged user 'eng'
# -------------------------------------------------------------------------
[engineering-git]
user      = "eng"
group     = "eng"
lockfile  = "/var/lock/backupd-eng.lock"
password  = "EngGitVaultKey2026!"
write     = {
    DEST="/var/backups/tenants/engineering/%h"
    mkdir -p "$DEST"
    cat > "$DEST/bundle-%d.bundle.zst"
}
read      = "cat /var/backups/tenants/engineering/%h/latest.bundle.zst"
ListAllow = "10.100.20.0/24"
ListDeny  = "*"

# -------------------------------------------------------------------------
# 3. Compliance WORM (Write Once, Read Many) Archive
# Sets Linux immutable flag (chattr +i) on completed archives.
# Runs as root (default: no user/group specified) to execute 'chattr +i'.
# -------------------------------------------------------------------------
[compliance-worm]
lockfile  = "/var/lock/backupd-worm.lock"
password  = "StrictLegalComplianceToken42"
write     = {
    DEST_DIR="/var/backups/tenants/legal/%h"
    mkdir -p "$DEST_DIR"
    TIMESTAMP=$(date +%Y%m%d_%H%M%S)
    ARCHIVE="$DEST_DIR/legal_record_${TIMESTAMP}.tar.zst"
    cat > "$ARCHIVE"
    sha256sum "$ARCHIVE" >> "$DEST_DIR/manifest.log"
    # Make immutable so even root cannot delete or modify without 'chattr -i'
    chattr +i "$ARCHIVE"
}
read      = "cat /var/backups/tenants/legal/%h/manifest.log"
ListAllow = "10.100.30.0/24"
ListDeny  = "*"

# -------------------------------------------------------------------------
# 4. Hidden Tenant Administration Hook
# Completely hidden from LIST discovery (ListDeny="*")
# Runs as root (default)
# -------------------------------------------------------------------------
[tenant-maintenance]
password  = "SuperSecretMultiTenantAdminMasterKey!"
ListDeny  = "*"
write     = "/usr/local/sbin/tenant-disk-quota-check"
read      = "df -h /var/backups/tenants"

#
# Sample Client Usage:
#   # Finance client backup:
#   tar -cpf - /srv/finance | zstd -3 | \
#     backupc -h backup-vault.corp -P "FinanceDeptSecretKey#2026" -T -w finance-vault
#
#   # Legal compliance immutable backup:
#   tar -cpf - /srv/legal-contracts | zstd -4 | \
#     backupc -h backup-vault.corp -s -P "StrictLegalComplianceToken42" -T -w compliance-worm
#
