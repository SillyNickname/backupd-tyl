#
# examples/backupd.zfs_btrfs.conf
#
# ZFS & Btrfs snapshot replication configuration for backupd-tyl
# Designed for continuous block-level filesystem synchronization.
#
# (C) 2026 Antigravity / Gemini (Google DeepMind)
# Based on original backupd concept by Ullrich von Bassewitz (1998)
# [Note: original author email uz@musoftware.de is no longer active]
# Requested and Commissioned by: Andre Kajita (kajita@univap.br)
#

# =========================================================================
# GLOBAL SETTINGS
# =========================================================================
Port = 12153
BindAddress = "0.0.0.0"
PidFile = "/var/run/backupd-zfs.pid"

# XChaCha20-Poly1305: 192-bit extended nonce eliminates nonce-collision
# risks during massive, multi-terabyte continuous stream replication.
DefaultCipher = "xchacha20"
AllowLegacy = no

# Logging
LogTarget = "file"
LogFile   = "/var/log/backupd-zfs.log"
LogLevel  = "info"

# Dedicated replication VLAN / private subnet
Allow = "10.200.0.0/16 127.0.0.1/32"
Deny  = "*"

# =========================================================================
# REPLICATION RESOURCES
#
# NOTE ON PERMISSIONS:
# File system snapshot management, 'zfs receive', and 'btrfs receive'
# require root capabilities (CAP_SYS_ADMIN). Because 'user' and 'group'
# are omitted here, backupd-tyl defaults to executing all commands as root.
# =========================================================================

# -------------------------------------------------------------------------
# 1. ZFS Pool Dataset Replication (zfs send / zfs receive)
# Runs as root (default) to create/mount datasets and rollback snapshots.
# -------------------------------------------------------------------------
[zfs-tank-dataset]
lockfile = "/var/lock/backupd-zfs-tank.lock"
password = "ZfsReplicationSharedSecretKey2026!"
# Server receives stream directly into replica pool
write    = "zfs receive -F -u tank/backup/%h"
# Server can also send latest snapshot back to client for restore
read     = "zfs send -R -c tank/backup/%h@latest"
Allow    = "10.200.1.0/24"
Deny     = "*"

# -------------------------------------------------------------------------
# 2. ZFS Raw Encrypted Stream Ingestion
# Receives client-encrypted dataset streams without server decryption keys
# -------------------------------------------------------------------------
[zfs-raw-encrypted]
lockfile = "/var/lock/backupd-zfs-raw.lock"
password = "RawZfsReplicationToken99"
write    = "zfs receive -F -u -s tank/vault/%h"
read     = "zfs send -R -w tank/vault/%h@latest"
Allow    = "10.200.1.0/24"
Deny     = "*"

# -------------------------------------------------------------------------
# 3. Btrfs Incremental Subvolume Sync
# Runs as root (default) to manage Btrfs subvolumes
# -------------------------------------------------------------------------
[btrfs-subvolume]
lockfile = "/var/lock/backupd-btrfs.lock"
password = "BtrfsSnapshotReplicationAuth2026!"
write    = "btrfs receive /srv/backups/btrfs/%h/"
read     = "btrfs send -p /srv/backups/btrfs/%h/parent /srv/backups/btrfs/%h/latest"
Allow    = "10.200.2.0/24"
Deny     = "*"

#
# Sample Client Usage:
#   # Replicate ZFS snapshot incrementally with throughput tracking:
#   zfs send -i tank/data@yesterday tank/data@today | \
#     backupc -h zfs-storage.corp -c xchacha20 -P "ZfsReplicationSharedSecretKey2026!" -T -w zfs-tank-dataset
#
#   # Replicate Btrfs subvolume snapshot:
#   btrfs send -p /home/.snapshots/1 /home/.snapshots/2 | \
#     backupc -h zfs-storage.corp -c xchacha20 -P "BtrfsSnapshotReplicationAuth2026!" -T -w btrfs-subvolume
#
