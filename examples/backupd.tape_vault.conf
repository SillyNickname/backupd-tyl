#
# examples/backupd.tape_vault.conf
#
# Physical LTO tape drive and offline archival configuration for backupd-tyl
# Supports LTO-6 / LTO-7 / LTO-8 / LTO-9 tape drives using 'dd' and 'mt-st'.
#
# (C) 2026 Antigravity / Gemini (Google DeepMind)
# Based on original backupd concept by Ullrich von Bassewitz (1998)
# [Note: original author email uz@musoftware.de is no longer active]
# Requested and Commissioned by: Andre Kajita (kajita@univap.br)
#

# =========================================================================
# GLOBAL SETTINGS
# =========================================================================
Port = 12153
BindAddress = "0.0.0.0"
PidFile = "/var/run/backupd-tape.pid"

# Default cipher: ChaCha20-Poly1305 (RFC 8439 high security standard)
DefaultCipher = "chacha20"
AllowLegacy = no

# Logging
LogTarget = "file"
LogFile   = "/var/log/backupd-tape.log"
LogLevel  = "info"

# Tape storage SAN / management network
ListAllow = "10.50.0.0/16 127.0.0.1/32"
ListDeny  = "*"

# =========================================================================
# TAPE DRIVE RESOURCES
#
# NOTE ON PERMISSIONS:
# Accessing raw SCSI tape device nodes (/dev/nst0, /dev/nst1) and issuing
# tape control ioctls requires root permissions. Because 'user' and 'group'
# are omitted, backupd-tyl defaults to executing all commands as root.
# =========================================================================

# -------------------------------------------------------------------------
# 1. Primary LTO Drive Streaming (Non-Rewinding /dev/nst0)
# Uses 256KB block size matching native LTO hardware buffer alignment.
# Runs as root (default: no user/group specified)
# -------------------------------------------------------------------------
[lto-drive0]
lockfile = "/var/lock/backupd-nst0.lock"
password = "TapeVaultMasterKey2026!"
# Server streams input directly to tape drive with progress tracking
write    = "dd of=/dev/nst0 bs=256k status=progress"
read     = "dd if=/dev/nst0 bs=256k status=progress"
ListAllow = "10.50.1.0/24"
ListDeny  = "*"

# -------------------------------------------------------------------------
# 2. Secondary LTO Drive Streaming (Non-Rewinding /dev/nst1)
# -------------------------------------------------------------------------
[lto-drive1]
lockfile = "/var/lock/backupd-nst1.lock"
password = "TapeVaultDrive1SecretKey!"
write    = "dd of=/dev/nst1 bs=256k status=progress"
read     = "dd if=/dev/nst1 bs=256k status=progress"
ListAllow = "10.50.1.0/24"
ListDeny  = "*"

# -------------------------------------------------------------------------
# 3. Tape Hardware Status Query
# Queries drive status using mt-st without advancing tape.
# -------------------------------------------------------------------------
[tape-status]
password  = "TapeOperatorInspectionKey"
read      = "mt -f /dev/nst0 status"
ListAllow = "10.50.1.0/24"
ListDeny  = "*"

# -------------------------------------------------------------------------
# 4. Hidden Tape Eject / Rewind Action
# Hidden from client 'backupc -l' discovery using local ListDeny="*"
# -------------------------------------------------------------------------
[tape-rewind-eject]
lockfile  = "/var/lock/backupd-nst0.lock"
password  = "TapeSuperAdminEjectAuth999!"
ListDeny  = "*"
write     = "mt -f /dev/nst0 rewoffl"
read      = "mt -f /dev/nst0 status"

#
# Sample Client Usage:
#   # Stream compressed tar archive directly onto LTO tape with live throughput:
#   tar -cpf - /var/archive | zstd -3 | \
#     backupc -h tape-vault.corp -P "TapeVaultMasterKey2026!" -T -w lto-drive0
#
#   # Query tape status:
#   backupc -h tape-vault.corp -P "TapeOperatorInspectionKey" -r tape-status
#
