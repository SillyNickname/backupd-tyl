#
# examples/backupd.virtualization.conf
#
# Virtualization & Container backup configuration for backupd-tyl
# Supports Proxmox VE, QEMU-KVM raw/qcow2 images, Docker, and Podman.
#
# (C) 2026 Antigravity / Gemini (Google DeepMind)
# Based on original backupd concept by Ullrich von Bassewitz (1998)
# [Note: original author email uz@musoftware.de is no longer active]
# Requested and Commissioned by: Andre Kajita (kajita@univap.br)
#

# =========================================================================
# GLOBAL SETTINGS
# =========================================================================
Port = 12153
BindAddress = "0.0.0.0"
PidFile = "/var/run/backupd-virt.pid"

# AES-256-GCM (NIST SP 800-38D): High-speed hardware-accelerated streaming
# for multi-gigabyte virtual disk images.
DefaultCipher = "aes256"
AllowLegacy = no

# Logging
LogTarget = "file"
LogFile   = "/var/log/backupd-virt.log"
LogLevel  = "info"

# Hypervisor private management VLAN
Allow = "10.150.0.0/16 127.0.0.1/32"
Deny  = "*"

# =========================================================================
# VIRTUALIZATION & CONTAINER RESOURCES
#
# NOTE ON PERMISSIONS:
# Interacting with hypervisors, raw disk images, and container storage
# requires elevated permissions. Because 'user' and 'group' are omitted
# in these sections, backupd-tyl defaults to executing all commands as root.
# =========================================================================

# -------------------------------------------------------------------------
# 1. Proxmox VE VMA Archive Storage
# Ingests compressed Proxmox VM backup archives (.vma.zst)
# Runs as root (default: no user/group specified)
# -------------------------------------------------------------------------
[proxmox-vma]
lockfile = "/var/lock/backupd-pve.lock"
password = "ProxmoxClusterVaultSecret2026!"
write    = {
    TARGET_DIR="/var/backups/vms/%h"
    mkdir -p "$TARGET_DIR"
    TIMESTAMP=$(date +%Y%m%d_%H%M%S)
    OUTFILE="$TARGET_DIR/vzdump-qemu-${TIMESTAMP}.vma.zst"
    cat > "$OUTFILE"
    ln -sf "$OUTFILE" "$TARGET_DIR/latest.vma.zst"
}
read     = "cat /var/backups/vms/%h/latest.vma.zst"
Allow    = "10.150.10.0/24"
Deny     = "*"

# -------------------------------------------------------------------------
# 2. QEMU-KVM Sparse Disk Image Streaming (qcow2 / raw)
# Runs as root (default)
# -------------------------------------------------------------------------
[kvm-disks]
lockfile = "/var/lock/backupd-kvm.lock"
password = "KvmDiskImageSecret2026!"
write    = "zstd -d | qemu-img convert -f raw -O qcow2 - /var/lib/libvirt/images/%h-disk.qcow2"
read     = "qemu-img convert -f qcow2 -O raw /var/lib/libvirt/images/%h-disk.qcow2 - | zstd -T0 -3"
Allow    = "10.150.20.0/24"
Deny     = "*"

# -------------------------------------------------------------------------
# 3. Docker Volume Tarball Ingestion
# Runs as root (default) to preserve file ownership and POSIX ACLs
# -------------------------------------------------------------------------
[docker-volumes]
password  = "DockerVolumeBackupSecret2026!"
write     = {
    DEST="/var/backups/docker/%h"
    mkdir -p "$DEST"
    cat > "$DEST/volumes-$(date +%Y%m%d).tar.zst"
}
read      = "cat /var/backups/docker/%h/volumes-latest.tar.zst"
Allow     = "10.150.30.0/24"
Deny      = "*"

# -------------------------------------------------------------------------
# 4. Podman Container Image Registry Archive
# Runs as root (default)
# -------------------------------------------------------------------------
[podman-images]
password  = "PodmanImageArchiveSecret2026!"
write     = "cat > /var/backups/containers/%h/images.tar"
read      = "cat /var/backups/containers/%h/images.tar"
Allow     = "10.150.30.0/24"
Deny      = "*"

#
# Sample Client Usage:
#   # Stream Proxmox VM backup directly across network:
#   vzdump 100 --dumpdir - --mode snapshot | \
#     backupc -h storage-node.corp -s -P "ProxmoxClusterVaultSecret2026!" -T -w proxmox-vma
#
#   # Stream Docker volumes backup:
#   tar -cpf - -C /var/lib/docker/volumes . | zstd -3 | \
#     backupc -h storage-node.corp -c aes256 -P "DockerVolumeBackupSecret2026!" -T -w docker-volumes
#
