#
# examples/backupd.minimal.conf
#
# Minimal lightweight configuration for backupd-tyl
# Ideal for embedded devices, single-board computers (Raspberry Pi),
# edge routers, and minimal resource environments.
#
# (C) 2026 Antigravity / Gemini (Google DeepMind)
# Based on original backupd concept by Ullrich von Bassewitz (1998)
# [Note: original author email uz@musoftware.de is no longer active]
# Requested and Commissioned by: Andre Kajita (kajita@univap.br)
#

# =========================================================================
# GLOBAL SETTINGS
# =========================================================================
Port = 12153
BindAddress = "0.0.0.0"

# ASCON-128a (NIST LWC standard): lowest CPU and memory footprint
DefaultCipher = "ascon"

# Disallow legacy unencrypted v0.20 clients
AllowLegacy = no

# Log directly to standard error (ideal for container supervisor / systemd)
LogTarget = "stderr"
LogLevel  = "info"

# Only allow connections from local loopback and LAN
Allow = "127.0.0.1/32 192.168.1.0/24"
Deny  = "*"

# =========================================================================
# RESOURCES
#
# NOTE ON PERMISSIONS:
# If 'user' and 'group' are omitted from a resource block, backupd-tyl
# defaults to running the command as root:root (preserving the daemon's
# root privileges).
# =========================================================================

# 1. Simple System Ingest
# Runs as root (default: no user/group specified).
[system-backup]
password  = "SimpleSecretKey123"
write     = "cat > /var/backups/%h.tar.zst"
read      = "cat /var/backups/%h.tar.zst"

#
# Sample Client Usage:
#   # Backup local files to server:
#   tar -cpf - /etc | zstd | backupc -h 192.168.1.50 -P "SimpleSecretKey123" -w system-backup
#
#   # Restore from server:
#   backupc -h 192.168.1.50 -P "SimpleSecretKey123" -r system-backup | zstd -d | tar -xpf -
#
