#
# examples/backupd.hardening.conf
#
# High-security zero-trust hardened configuration for backupd-tyl
# Designed for compliance with CIS benchmarks, NIST SP 800-53, HIPAA,
# and PCI-DSS requirements.
#
# (C) 2026 Antigravity / Gemini (Google DeepMind)
# Based on original backupd concept by Ullrich von Bassewitz (1998)
# [Note: original author email uz@musoftware.de is no longer active]
# Requested and Commissioned by: Andre Kajita (kajita@univap.br)
#

# =========================================================================
# GLOBAL HARDENING DIRECTIVES
# =========================================================================
Port = 12153
# Bind exclusively to internal secure management interface (e.g. 10.0.100.5)
BindAddress = "10.0.100.5"
PidFile = "/var/run/backupd-hardened.pid"

# Enforce AES-256-GCM (NIST SP 800-38D): FIPS-compliant 256-bit AEAD
DefaultCipher = "aes256"

# Strictly disable legacy unencrypted 1998 v0.20 clients
AllowLegacy = no

# Disable reverse DNS lookups to eliminate DNS spoofing / poisoning risks
NoDNS = 1

# Enterprise syslog integration with central SIEM (rsyslog / Splunk / Elastic)
LogTarget   = "syslog"
LogFacility = "local6"
LogLevel    = "info"

# Zero-trust network access: deny all hosts globally unless explicitly permitted
Deny = "*"

# =========================================================================
# HARDENED RESOURCES
#
# NOTE ON PERMISSIONS:
# - Resources running with specific system user/group drop privileges.
# - If 'user' and 'group' are omitted, backupd-tyl defaults to running
#   the resource as root (UID 0 / GID 0).
# =========================================================================

# -------------------------------------------------------------------------
# 1. PCI-DSS Encrypted Ingestion Vault
# Strict 0077 umask prevents any other local system user from reading files.
# Runs under dedicated unprivileged 'backup' system account.
# -------------------------------------------------------------------------
[pci-credit-card-vault]
user      = "backup"
group     = "backup"
umask     = 0077
lockfile  = "/var/lock/backupd-pci.lock"
password  = "K9#mQ$8xL!2vW&pZ@5tB*7jR#4nF%1yD"
write     = {
    DEST_DIR="/var/backups/pci/%h"
    mkdir -p "$DEST_DIR"
    chmod 0700 "$DEST_DIR"
    TIMESTAMP=$(date +%Y%m%d_%H%M%S)
    ARCHIVE="$DEST_DIR/pci_data_${TIMESTAMP}.enc.zst"
    cat > "$ARCHIVE"
    chmod 0600 "$ARCHIVE"
    sha256sum "$ARCHIVE" >> "$DEST_DIR/audit_hashes.log"
}
read      = "cat /var/backups/pci/%h/audit_hashes.log"
# Only permit connections from the designated payment processing server
Allow     = "10.0.100.22/32"
Deny      = "*"

# -------------------------------------------------------------------------
# 2. System Root Volume Disaster Recovery
# Runs as root (default: no user/group specified) to restore system files
# -------------------------------------------------------------------------
[root-disaster-recovery]
umask     = 0077
lockfile  = "/var/lock/backupd-rootdr.lock"
password  = "P@ssw0rd#DisasterRecovery2026!MasterKey"
write     = "zstd -T0 -4 > /var/backups/dr/%h-root-$(date +%Y%m%d).tar.zst"
read      = "zstd -d -c /var/backups/dr/%h-root-latest.tar.zst"
Allow     = "10.0.100.10/32 10.0.100.11/32"
Deny      = "*"

#
# Sample Client Usage:
#   # Backup PCI data using AES-256-GCM with audit negotiation trace:
#   tar -cpf - /var/pci-data | zstd -4 | \
#     backupc -h 10.0.100.5 -s -P "K9#mQ$8xL!2vW&pZ@5tB*7jR#4nF%1yD" -N stdout -T -w pci-credit-card-vault
#
